<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GeoLocalización App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .card h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
        }

        .location-box {
            background: #f4f6f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .location-box p {
            margin: 8px 0;
            color: #555;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2a5298;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #1e3c72;
        }

        .map-placeholder {
            margin-top: 20px;
            height: 150px;
            border-radius: 10px;
            background: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📍 Mi Ubicación</h1>

        <div class="location-box">
            <p><strong>Latitud:</strong> --</p>
            <p><strong>Longitud:</strong> --</p>
            <p><strong>Precisión:</strong> --</p>
        </div>

        <button class="btn">Obtener Ubicación</button>

        <div class="map-placeholder">
            Aquí se mostrará el mapa
        </div>
    </div>

</body>
</html>
